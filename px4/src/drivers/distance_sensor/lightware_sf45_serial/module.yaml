module_name: Lightware SF45 Rangefinder (serial)
serial_config:
    - command: lightware_sf45_serial start -d ${SERIAL_DEV}
      port_config_param:
        name: SENS_EN_SF45_CFG
        group: Sensors
      num_instances: 1
      supports_networking: false

parameters:
    - group: Sensors
      definitions:
          SF45_TIMEOUT:
              description:
                  short: SF45 obstacle observation timeout
                  long: |
                      Maximum age of a measured angular bin before it becomes
                      unknown. Choose according to the scan revisit interval and
                      acceptable obstacle latency. Increasing this value retains
                      old obstacle measurements longer. Unmeasured directions
                      always remain unknown; scan limits do not change the 5 degree
                      map spacing.
              type: int32
              unit: ms
              min: 20
              max: 5000
              default: 100
              reboot_required: true

          SF45_BAUD_CFG:
              description:
                  short: SF45 UART baud rate
                  long: |
                      Host UART baud rate. Must match the baud rate stored in the
                      SF45 sensor. This parameter does not reprogram the sensor.
                      Applies to the direct serial driver, not DroneCAN reception.
              type: enum
              values:
                  9600: 9600 baud
                  19200: 19200 baud
                  38400: 38400 baud
                  57600: 57600 baud
                  115200: 115200 baud
                  230400: 230400 baud
                  460800: 460800 baud
                  921600: 921600 baud
              reboot_required: true
              default: 921600

          SF45_UPDATE_CFG:
              description:
                  short: Update rate in Hz
                  long: |
                      The SF45 sets the update rate in Hz to allow greater resolution
              type: enum
              values:
                  1: 50hz
                  2: 100hz
                  3: 200hz
                  4: 400hz
                  5: 500hz
                  6: 625hz
                  7: 1000hz
                  8: 1250hz
                  9: 1538hz
                  10: 2000hz
                  11: 2500hz
                  12: 5000hz
              reboot_required: true
              num_instances: 1
              default: 5

          SF45_ORIENT_CFG:
              description:
                  short: Orientation upright or facing downward
                  long: |
                      The SF45 mounted facing upward or downward on the frame
              type: enum
              values:
                24: Rotation upward
                25: Rotation downward
              reboot_required: true
              num_instances: 1
              default: 24

          SF45_YAW_CFG:
              description:
                  short: Sensor facing forward or backward
                  long: |
                      The usb port on the sensor indicates 180deg, opposite usb is forward facing
              type: enum
              values:
                0: Rotation forward
                2: Rotation right
                4: Rotation backward
                6: Rotation left
              reboot_required: true
              num_instances: 1
              default: 0
