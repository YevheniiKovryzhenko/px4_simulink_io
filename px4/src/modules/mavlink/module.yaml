__max_num_config_instances: &max_num_config_instances 3

module_name: MAVLink
serial_config:
    - command: |
        if [ $SERIAL_DEV != ethernet ]; then
            set MAV_ARGS "-d ${SERIAL_DEV} -b p:${BAUD_PARAM} -m p:MAV_${i}_MODE -r p:MAV_${i}_RATE"
        else
            set MAV_ARGS "-u p:MAV_${i}_UDP_PRT -o p:MAV_${i}_REMOTE_PRT -m p:MAV_${i}_MODE -r p:MAV_${i}_RATE"
            if param compare MAV_${i}_BROADCAST 1
            then
                set MAV_ARGS "${MAV_ARGS} -p"
            fi
            if param compare MAV_${i}_BROADCAST 2
            then
                set MAV_ARGS "${MAV_ARGS} -c"
            fi
        fi
        if param compare MAV_${i}_FORWARD 1
        then
            set MAV_ARGS "${MAV_ARGS} -f"
        fi
        if param compare MAV_${i}_RADIO_CTL 1
        then
            set MAV_ARGS "${MAV_ARGS} -s"
        fi
        if param compare MAV_${i}_FLOW_CTRL 0
        then
            set MAV_ARGS "${MAV_ARGS} -Z"
        fi
        if param compare MAV_${i}_FLOW_CTRL 1
        then
            set MAV_ARGS "${MAV_ARGS} -z"
        fi
        if param compare MAV_${i}_MODE 6
        then
            set MAV_ARGS "${MAV_ARGS} -F p:MAV_${i}_HL_FREQ"
        fi
        mavlink start ${MAV_ARGS} -x
      port_config_param:
        name: MAV_${i}_CONFIG
        group: MAVLink
        # MAVLink instances:
        # 0: Telem1 Port (Telemetry Link)
        # 1: Telem2 Port (Companion Link). Disabled by default to reduce RAM usage
        # 2: Board-specific / no fixed function or port
        default: [TEL1, "", ""]
      num_instances: *max_num_config_instances
      supports_networking: true

parameters:
    - group: MAVLink
      definitions:
        MAV_${i}_MODE:
            description:
                short: MAVLink Mode for instance ${i}
                long: |
                    The MAVLink Mode defines the set of streamed messages (for example the
                    vehicle's attitude) and their sending rates.

            type: enum
            values:
                0: Normal
                1: Custom
                2: Onboard
                3: OSD
                4: Magic
                5: Config
                #6: Iridium # as the user does not need to configure this, hide it from the UI
                7: Minimal
                8: External Vision
                #9: External Vision Minimal # hidden
                10: Gimbal
                11: Onboard Low Bandwidth
                12: uAvionix
                13: Low Bandwidth
                14: Distance Sensor
                15: Simulink
                16: Companion
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [0, 2, 0]

        MAV_${i}_RATE:
            description:
                short: Maximum MAVLink sending rate for instance ${i}
                long: |
                    Configure the maximum sending rate for the MAVLink streams in Bytes/sec.
                    If the configured streams exceed the maximum rate, the sending rate of
                    each stream is automatically decreased.

                    If this is set to 0 a value of half of the theoretical maximum bandwidth is used.
                    This corresponds to baudrate/20 Bytes/s (baudrate/10 = maximum data rate on
                    8N1-configured links).

            type: int32
            min: 0
            unit: B/s
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [1200, 0, 0]

        MAV_${i}_FORWARD:
            description:
                short: Enable MAVLink Message forwarding for instance ${i}
                long: |
                    If enabled, forward incoming MAVLink messages to other MAVLink ports if the
                    message is either broadcast or the target is not the autopilot.

                    This allows for example a GCS to talk to a camera that is connected to the
                    autopilot via MAVLink (on a different link than the GCS).

            type: boolean
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [true, false, false]

        MAV_${i}_RADIO_CTL:
            description:
                short: Enable software throttling of mavlink on instance ${i}
                long: |
                    If enabled, MAVLink messages will be throttled according to
                    `txbuf` field reported by radio_status.

                    Requires a radio to send the mavlink message RADIO_STATUS.

            type: boolean
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [true, true, true]

        MAV_${i}_UDP_PRT:
            description:
                short: MAVLink Network Port for instance ${i}
                long: |
                    If ethernet enabled and selected as configuration for MAVLink instance ${i},
                    selected udp port will be set and used in MAVLink instance ${i}.

            type: int32
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [14556, 0, 0]
            requires_ethernet: true

        MAV_${i}_REMOTE_PRT:
            description:
                short: MAVLink Remote Port for instance ${i}
                long: |
                    If ethernet enabled and selected as configuration for MAVLink instance ${i},
                    selected remote port will be set and used in MAVLink instance ${i}.

            type: int32
            reboot_required: true
            num_instances: *max_num_config_instances
            default: [14550, 0, 0]
            requires_ethernet: true

        MAV_${i}_BROADCAST:
            description:
                short: Broadcast heartbeats on local network for MAVLink instance ${i}
                long: |
                    This allows a ground control station to automatically find the drone
                    on the local network.

            type: enum
            values:
                0: Never broadcast
                1: Always broadcast
                2: Only multicast
            num_instances: *max_num_config_instances
            default: [1, 0, 0]
            requires_ethernet: true

        MAV_${i}_FLOW_CTRL:
            description:
                short: Enable serial flow control for instance ${i}
                long: |
                    This is used to force flow control on or off for the the mavlink
                    instance. By default it is auto detected. Use when auto detection fails.

            type: enum
            values:
                0: Force off
                1: Force on
                2: Auto-detected
            num_instances: *max_num_config_instances
            default: [2, 2, 2]
            reboot_required: true

        MAV_${i}_HL_FREQ:
            description:
                short: Configures the frequency of HIGH_LATENCY2 stream for instance ${i}
                long: |
                    Positive real value that configures the transmission frequency of the
                    HIGH_LATENCY2 stream for instance ${i}, configured in iridium mode.
                    This parameter has no effect if the instance mode is different from iridium.

            type: float
            decimal: 3
            increment: 0.001
            unit: Hz
            min: 0.0
            max: 50.0
            num_instances: *max_num_config_instances
            default: [0.015, 0.015, 0.015]
            reboot_required: true

        MAV_S_MODE:
            description:
                short: MAVLink Mode for SOM to FMU communication channel
                long: |
                    The MAVLink Mode defines the set of streamed messages (for example the
                    vehicle's attitude) and their sending rates.

            type: enum
            values:
                0: Normal
                #1: Custom
                2: Onboard
                #3: OSD
                #4: Magic
                5: Config
                #6: Iridium
                7: Minimal
                #8: External Vision
                #9: External Vision Minimal
                #10: Gimbal
                11: Onboard Low Bandwidth
                #12: uAvionix
                13: Low Bandwidth
                # We shadow the modes that can block the FMU to SOM connection
            reboot_required: true
            default: 11

        MAV_S_FORWARD:
            description:
                short: Enable MAVLink forwarding on TELEM2
                long : |
                    TELEM2 on Skynode only.

            type: boolean
            reboot_required: true
            default: false

    - group: SIM MAVLink Streamer
      definitions:
        SM_MAV:
                description:
                    short: Choose custom Simulink MAVLink streams
                    long: |
                        Select individual custom topics to broadcast over MAVLink.
                        Rates are controlled by respective SM_MAVOUT_* and SMG_MAV* rate parameters.
                type: bitmask
                bit:
                    0: companion_guidance_outbound
                    1: companion_guidance_inbound
                    2: simulink_inbound
                    3: simulink_outbound
                    4: simulink_outbound_1
                    5: simulink_outbound_2
                    6: simulink_outbound_3
                    7: simulink_guidance
                default: 255

        SMG_MAVOUT_R:
                description:
                    short: Rate for COMPANION_GUIDANCE_OUTBOUND
                    long: |
                        Transmission rate for companion_guidance_outbound streams.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 20.0

        SMG_MAVIN_R:
                description:
                    short: Rate for COMPANION_GUIDANCE_INBOUND
                    long: |
                        Transmission rate for companion_guidance_inbound streams.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 20.0

        SM_MAVIN_R:
                description:
                    short: Rate for SIMULINK_INBOUND
                    long: |
                        Transmission rate for base simulink_inbound streams.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 20.0

        SM_MAVOUT_${i}_R:
                description:
                    short: SIMULINK Outbound mavlink stream rate
                    long: |
                        SIMULINK parameter for setting the streaming rate
                        of sm_outbound_${i} simulink stream (if enabled).
                        Note that the real streaming rate is limited
                        by the update rate of the simulink model
                        and will be throttled down based on the
                        lowest of the two.
                type: float
                decimal: 1
                unit: Hz
                min: 0
                max: 100
                reboot_required: true
                num_instances: 4
                instance_start: 0
                default: 20.0

        SMG_MAV_R:
                description:
                    short: Rate for SIMULINK_GUIDANCE
                    long: |
                        Transmission rate for base simulink_guidance streams.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 20.0

        SM_MAVSTD:
                description:
                    short: Choose standard PX4 MAVLink streams
                    long: |
                        Select individual core PX4 telemetry and setpoint states to broadcast.
                        Rates are controlled by independent SM_MAV_*_R parameters.
                type: bitmask
                bit:
                    0: ATTITUDE
                    1: ATTITUDE_QUATERNION
                    2: ATTITUDE_TARGET
                    3: LOCAL_POSITION_NED
                    4: POSITION_TARGET_LOCAL_NED
                    5: GLOBAL_POSITION
                    6: GLOBAL_POSITION_INT
                    7: POSITION_TARGET_GLOBAL_INT
                    8: SERVO_OUTPUT_RAW_0
                    9: ESC_STATUS
                    10: RAW_RPM
                default: 2047

        SM_MAV_ATT_R:
                description:
                    short: Rate for ATTITUDE
                    long: |
                        Transmission frequency for vehicle Euler orientation tracking states.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 15.0

        SM_MAV_ATTQ_R:
                description:
                    short: Rate for ATTITUDE_QUATERNION
                    long: |
                        Transmission frequency for raw quaternion state vectors.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 10.0

        SM_MAV_ATTT_R:
                description:
                    short: Rate for ATTITUDE_TARGET
                    long: |
                        Transmission frequency for target demand values and reference tracking loops.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 2.0

        SM_MAV_LP_R:
                description:
                    short: Rate for LOCAL_POSITION_NED
                    long: |
                        Transmission frequency for local position, velocity, and acceleration matrices.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 10.0

        SM_MAV_LPT_R:
                description:
                    short: Rate for POSITION_TARGET_LOCAL_NED
                    long: |
                        Transmission frequency for local tracking setpoints, demands, and force vectors.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 10.0

        SM_MAV_GP_R:
                description:
                    short: Rate for GLOBAL_POSITION
                    long: |
                        Transmission frequency for base global latitude, longitude, and altitude variables.
                type: float
                unit: Hz
                min: 0.0
                max: 50.0
                default: 5.0

        SM_MAV_GPI_R:
                description:
                    short: Rate for GLOBAL_POSITION_INT
                    long: |
                        Transmission frequency for integer-optimized global positioning frames.
                type: float
                unit: Hz
                min: 0.0
                max: 50.0
                default: 5.0

        SM_MAV_GPT_R:
                description:
                    short: Rate for POSITION_TARGET_GLOBAL_INT
                    long: |
                        Transmission frequency for integer global destination reference targets.
                type: float
                unit: Hz
                min: 0.0
                max: 50.0
                default: 1.0

        SM_MAV_SRV_R:
                description:
                    short: Rate for SERVO_OUTPUT_RAW_0
                    long: |
                        Transmission frequency for servo commands and raw torque actuator signals.
                type: float
                unit: Hz
                min: 0.0
                max: 250.0
                default: 10.0

        SM_MAV_ESC_R:
                description:
                    short: Rate for ESC_STATUS
                    long: |
                        Transmission frequency for combined ESC telemetry vectors.
                type: float
                unit: Hz
                min: 0.0
                max: 50.0
                default: 1.0

        SM_MAV_RPM_R:
                description:
                    short: Rate for RAW_RPM
                    long: |
                        Transmission frequency for individual active motor rotor velocity tracking.
                type: float
                unit: Hz
                min: 0.0
                max: 100.0
                default: 2.0
